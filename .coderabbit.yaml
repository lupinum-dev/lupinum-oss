# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - '!**/*.png'
    - '!**/*.woff'
    - '!**/*.woff2'
  path_instructions:
    - path: '.github/workflows/**'
      instructions: |
        Check least-privilege permissions per job, full-SHA action pins, untrusted input in shell, and that no job both installs dependencies and holds publish rights. No npm or Vercel tokens.
    - path: 'starters/**'
      instructions: |
        Review generated output as a real new repository. It must follow the handbook in docs/content/docs and stay lean: no scripts or checks that do not guard user-facing behavior or a real attack path.
    - path: '**/*.md'
      instructions: |
        Follow docs/WRITING.md: plain, direct American English, short sentences, exact commands.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_usernames:
      - renovate[bot]
      - github-actions[bot]

chat:
  auto_reply: true
