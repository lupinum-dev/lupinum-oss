name: Publish
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Exact fixed version from all package manifests', required: true, type: string }
      allow_bootstrap: { description: 'Authorize exact first-version recovery without npm provenance', required: false, default: false, type: boolean }
permissions: {}
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - name: Require main and valid version
        env: { RELEASE_REF: "${{ github.ref }}", RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          test "$RELEASE_REF" = refs/heads/main
          node -e "if (!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid version')"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.18.0, package-manager-cache: false }
      - run: corepack enable pnpm && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - run: test "$(node -p "require('./release-artifacts/release.json').version")" = "${{ inputs.version }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: { name: certified-release, path: release-artifacts, if-no-files-found: error, retention-days: 14 }
  publish:
    needs: certify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions: { actions: read, contents: read, id-token: write }
    outputs:
      bootstrap: ${{ steps.publish.outputs.bootstrap }}
      bootstrap-packages: ${{ steps.publish.outputs.bootstrap-packages }}
      modes: ${{ steps.publish.outputs.modes }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.18.0, registry-url: 'https://registry.npmjs.org', package-manager-cache: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: certified-release, path: release-artifacts }
      - name: Verify and publish fixed package set
        id: publish
        working-directory: release-artifacts
        env: { ALLOW_BOOTSTRAP: "${{ inputs.allow_bootstrap }}", RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          sha256sum --check --strict SHA256SUMS
          test "$(node -p "require('./release.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./release.json').sourceSha")" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import { execFileSync, spawnSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'
          const record = JSON.parse(readFileSync('release.json', 'utf8'))
          if (record.packages.length < 2 || record.packages.some(pkg => pkg.version !== process.env.RELEASE_VERSION)) throw new Error('Unexpected package set.')
          if (new Set(record.packages.map(pkg => pkg.name)).size !== record.packages.length) throw new Error('Package names must be unique.')
          const sorted = [...record.packages].sort((left, right) => left.name.localeCompare(right.name))
          if (record.packages.some((pkg, index) => pkg.name !== sorted[index].name)) throw new Error('Package inventory must be sorted by name.')
          for (const pkg of record.packages) {
            const manifest = JSON.parse(execFileSync('tar', ['-xOf', pkg.filename, 'package/package.json'], { encoding: 'utf8' }))
            if (manifest.name !== pkg.name || manifest.version !== pkg.version) throw new Error(`Tarball identity differs for ${pkg.name}.`)
          }
          const expectedTag = record.version.includes('-') ? 'next' : 'latest'
          if (record.distTag !== expectedTag) throw new Error('Unexpected distribution tag.')
          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const modes = new Map()
          for (const pkg of record.packages) {
            const spec = `${pkg.name}@${pkg.version}`
            const existing = view(spec, 'dist.shasum')
            if (existing && existing !== pkg.shasum) fail(`${spec} exists with different bytes.`)
            if (existing) {
              const attestations = view(spec, 'dist.attestations')
              const published = view(pkg.name, 'versions')
              const versions = Array.isArray(published) ? published : [published]
              if (!attestations && (versions.length !== 1 || versions[0] !== pkg.version)) {
                fail(`${spec} is not the first package version and has no provenance.`)
              }
              if (!attestations && process.env.ALLOW_BOOTSTRAP !== 'true') {
                fail(`${spec} requires explicit bootstrap authorization.`)
              }
              modes.set(pkg.name, attestations ? 'oidc' : 'bootstrap')
            } else {
              const result = run([
                'publish', pkg.filename, '--provenance', '--access', 'public',
                '--tag', record.distTag, '--ignore-scripts',
              ], true)
              if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
              modes.set(pkg.name, 'oidc')
            }
          }
          for (const pkg of record.packages) {
            const spec = `${pkg.name}@${pkg.version}`
            let verified = false
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const shasum = view(spec, 'dist.shasum')
              const attestations = view(spec, 'dist.attestations')
              const channel = view(pkg.name, `dist-tags.${record.distTag}`)
              const mode = modes.get(pkg.name)
              const published = mode === 'bootstrap' ? view(pkg.name, 'versions') : null
              const versions = Array.isArray(published) ? published : [published]
              const remainsFirstVersion = mode !== 'bootstrap' || (versions.length === 1 && versions[0] === pkg.version)
              if (
                shasum === pkg.shasum && channel === pkg.version && remainsFirstVersion &&
                (mode === 'bootstrap' || (mode === 'oidc' && attestations))
              ) {
                verified = true
                break
              }
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
            }
            if (!verified) fail(`${spec} did not expose the required bytes, provenance mode, and ${record.distTag}.`)
          }
          const publicationModes = Object.fromEntries(modes)
          const bootstrapPackages = [...modes].filter(([, mode]) => mode === 'bootstrap').map(([name]) => name)
          appendFileSync(process.env.GITHUB_OUTPUT, `bootstrap=${String(bootstrapPackages.length > 0)}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `bootstrap-packages=${bootstrapPackages.join(',')}\n`)
          appendFileSync(process.env.GITHUB_OUTPUT, `modes=${JSON.stringify(publicationModes)}\n`)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nPublication modes: ${JSON.stringify(publicationModes)}.\n`)
          NODE
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { actions: read, contents: write }
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: certified-release, path: release-artifacts }
      - name: Create release from certified package set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          BOOTSTRAP_RELEASE: ${{ needs.publish.outputs.bootstrap }}
          BOOTSTRAP_PACKAGES: ${{ needs.publish.outputs.bootstrap-packages }}
        run: |
          cd release-artifacts
          sha256sum --check --strict SHA256SUMS
          test "$(node -p "require('./release.json').sourceSha")" = "$GITHUB_SHA"
          prerelease=(); [[ "$RELEASE_VERSION" == *-* ]] && prerelease=(--prerelease)
          test -s release-notes.md
          cp release-notes.md github-release-notes.md
          if [ "$BOOTSTRAP_RELEASE" = true ]; then
            cat >> github-release-notes.md <<'NOTICE'

          > [!NOTE]
          > This first npm version was created from the exact CI-certified artifact before npm trusted publishing could be configured. npm does not provide GitHub OIDC provenance for this bootstrap publication. The protected workflow verified the registry bytes. Later versions use trusted publishing with provenance.
          NOTICE
            printf '> Bootstrap packages: %s\n' "$BOOTSTRAP_PACKAGES" >> github-release-notes.md
          fi
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.sha')"
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "v$RELEASE_VERSION" ./*.tgz release.json SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --title "v$RELEASE_VERSION" --notes-file github-release-notes.md
          else
            gh release create "v$RELEASE_VERSION" ./*.tgz release.json SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes-file github-release-notes.md "${prerelease[@]}"
          fi
