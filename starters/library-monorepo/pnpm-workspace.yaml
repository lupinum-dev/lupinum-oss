packages:
  - packages/*
  - docs

# Dependency quarantine: never install versions younger than 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Only these dependencies may run install scripts.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  vue-demi: true

overrides:
  # Remove when fontless requires esbuild 0.28.1 or newer.
  'fontless>esbuild': 0.28.2
  # Remove when tsup and bundle-require require esbuild 0.28.1 or newer.
  'tsup>esbuild': 0.28.2
  'bundle-require>esbuild': 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  'vite>esbuild': 0.28.2
  # Remove when @lupinum/ginko-docs requires satori 0.33.5 or newer (GHSA-wx4j-mvgx-mqwp;
  # nuxt-og-image 6.9 refuses older versions) and satori requires fflate 0.7.5 or newer.
  '@lupinum/ginko-docs>satori': 0.33.5
  'satori>fflate': 0.7.5
