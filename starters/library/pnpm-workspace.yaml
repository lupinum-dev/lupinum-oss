# `.` makes the root package visible to Changesets next to the docs site.
packages:
  - .
  - docs

# Dependency quarantine: never install versions younger than 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Our own scope skips it: only our protected release workflows publish it (D14).
minimumReleaseAgeExclude:
  - '@lupinum/*'

# Only these dependencies may run install scripts.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  # Its install script only checks for a native binding, which optional dependencies already provide.
  unrs-resolver: false
  vue-demi: true

overrides:
  # Remove when fontless requires esbuild 0.28.1 or newer.
  'fontless>esbuild': 0.28.2
  # Remove when tsup and bundle-require require esbuild 0.28.1 or newer.
  'tsup>esbuild': 0.28.2
  'bundle-require>esbuild': 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  'vite>esbuild': 0.28.2
  # Remove when @lupinum/ginko-docs requires satori 0.33.5 or newer (GHSA-wx4j-mvgx-mqwp;
  # nuxt-og-image 6.9 refuses older versions) and satori requires fflate 0.7.5 or newer.
  '@lupinum/ginko-docs>satori': 0.33.5
  'satori>fflate': 0.7.5

auditConfig:
  ignoreGhsas:
    # No fixed simple-git 3.x, and Nuxt DevTools fails to load 4.x. DevTools runs only in `nuxt dev`
    # on a developer machine with the repository's own arguments. Recheck 2026-11-06.
    - GHSA-v5rq-49vh-5v5c
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    # No published fix; braces processes build-time glob patterns, not published site input. Recheck 2026-11-01.
    - GHSA-vfj7-8cjw-p6xm
    # No published fix; node-forge is used only for listhen dev-server self-signed certificates. Recheck 2026-11-01.
    - GHSA-86w9-cpqp-85rv
