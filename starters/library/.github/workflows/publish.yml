name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from package.json
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - name: Require current main and valid version
        env: { RELEASE_REF: "${{ github.ref }}", RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          test "$RELEASE_REF" = refs/heads/main
          node -e "if (!/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid version')"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.18.0, package-manager-cache: false }
      - run: corepack enable pnpm && corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - run: pnpm release:verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: certified-release
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: certify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24.18.0, registry-url: 'https://registry.npmjs.org', package-manager-cache: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: certified-release, path: release-artifacts }
      - name: Verify and publish inert artifact
        working-directory: release-artifacts
        env: { RELEASE_VERSION: "${{ inputs.version }}" }
        run: |
          sha256sum --check --strict SHA256SUMS
          test "$(node -p "require('./release.json').version")" = "$RELEASE_VERSION"
          tarball="$(node -p "require('./release.json').filename")"
          package_name="$(tar -xOf "$tarball" package/package.json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).name))")"
          package_version="$(tar -xOf "$tarball" package/package.json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input).version))")"
          test "$package_name" = '{{PACKAGE_NAME}}'
          test "$package_version" = "$RELEASE_VERSION"
          channel=latest; [[ "$RELEASE_VERSION" == *-* ]] && channel=next
          test "$(node -p "require('./release.json').distTag")" = "$channel"
          expected_shasum="$(node -p "require('./release.json').shasum")"
          if published_shasum="$(npm view "$package_name@$package_version" dist.shasum 2>npm-view.err)"; then
            test "$published_shasum" = "$expected_shasum"
            echo "$package_name@$package_version already matches the certified artifact."
          else
            grep -q 'E404' npm-view.err || { cat npm-view.err; exit 1; }
            npm publish "$tarball" --provenance --access public --tag "$channel" --ignore-scripts
          fi

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with: { name: certified-release, path: release-artifacts }
      - name: Create release from certified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd release-artifacts
          sha256sum --check --strict SHA256SUMS
          tarball="$(node -p "require('./release.json').filename")"
          prerelease=(); [[ "$RELEASE_VERSION" == *-* ]] && prerelease=(--prerelease)
          test -s release-notes.md
          gh release create "v$RELEASE_VERSION" "$tarball" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes-file release-notes.md "${prerelease[@]}"
