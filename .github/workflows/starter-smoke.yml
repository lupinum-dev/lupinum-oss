name: starter smoke

# Generates every starter and runs its own `pnpm verify` from a clean install.
# The weekly run catches upstream breakage before someone starts a new repository.
on:
  pull_request:
    paths:
      - starters/**
      - scripts/verify-starters.mjs
      - .github/workflows/starter-smoke.yml
  push:
    branches: [main]
    paths:
      - starters/**
      - scripts/verify-starters.mjs
      - .github/workflows/starter-smoke.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter:
    name: starter (${{ matrix.starter }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        starter: [library, library-monorepo, nuxt-module]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-starters.mjs ${{ matrix.starter }}
