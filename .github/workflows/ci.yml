name: CI

on:
  pull_request:
  push:
    branches: [main]

  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - run: corepack enable
      - if: github.event.schedule == '23 4 * * *'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: github.event.schedule == '23 4 * * *'
        run: pnpm check:dependencies
      - if: github.event.schedule == '23 4 * * *'
        run: pnpm starters:verify
      - if: github.event.schedule != '23 4 * * *'
        run: pnpm install --frozen-lockfile
      - if: github.event.schedule != '23 4 * * *'
        run: pnpm verify
      - name: Verify pinned Actions exist upstream
        run: node scripts/verify-action-shas.mjs
