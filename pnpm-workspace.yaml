packages:
  - docs

autoInstallPeers: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  vue-demi: true

overrides:
  # Remove when fontless requires esbuild 0.28.1 or newer.
  "fontless>esbuild": 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  "vite>esbuild": 0.28.2
  # Remove when Nuxt requires devalue 5.9.1 or newer (GHSA DoS in devalue < 5.9.1).
  devalue: 5.9.4
