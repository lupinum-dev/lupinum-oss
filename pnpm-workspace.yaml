packages:
  - docs

autoInstallPeers: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  vue-demi: true

overrides:
  # Fix undici high advisories; remove when unifont depends on a fixed version (>=8.10.2).
  "unifont>undici": 8.11.2
  # Remove when fontless requires esbuild 0.28.1 or newer.
  "fontless>esbuild": 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  "vite>esbuild": 0.28.2
  # Remove when Nuxt requires devalue 5.9.1 or newer (GHSA DoS in devalue < 5.9.1).
  devalue: 5.9.4
  # Remove when @vue/compiler-core requires source-map-js 1.2.2 or newer (GHSA-68fv-2mgg-jv7q).
  source-map-js: 1.2.2

auditConfig:
  ignoreGhsas:
    # No fixed simple-git 3.x, and Nuxt DevTools fails to load 4.x. DevTools runs only in `nuxt dev`
    # on a developer machine with the repository's own arguments. Recheck 2026-11-06.
    - GHSA-v5rq-49vh-5v5c
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    # No published fix; braces processes build-time glob patterns, not published site input. Recheck 2026-11-01.
    - GHSA-vfj7-8cjw-p6xm
    # No published fix; node-forge is used only for listhen dev-server self-signed certificates. Recheck 2026-11-01.
    - GHSA-86w9-cpqp-85rv
