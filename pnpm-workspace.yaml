packages:
  - docs

autoInstallPeers: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Exact first-party prerelease certified in lupinum-dev/ginko-docs Actions run
# 33392984677. Remove after 2026-09-01 15:00 Europe/Vienna.
minimumReleaseAgeExclude:
  - "@lupinum/ginko-docs@0.4.0-rc.4"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  vue-demi: true

overrides:
  # Remove when fontless requires esbuild 0.28.1 or newer.
  "fontless>esbuild": 0.28.2
  # Remove when Vite requires esbuild 0.28.1 or newer.
  "vite>esbuild": 0.28.2
